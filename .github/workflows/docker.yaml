# https://github.com/docker/build-push-action
# https://docs.github.com/en/actions/learn-github-actions/contexts

name: "docker"

permissions:
  contents: "write"
  packages: "write"
  id-token: "write"

on:
  push:
    branches:
      - "dev"
      - "main"
    paths-ignore:
      - "helm/**"
      - ".github/workflows/helm.yaml"
      - ".github/workflows/dagger.yaml"

env:
  REGISTRY: "ghcr.io"

jobs:
  
  imageversion:
  
    runs-on: "ubuntu-24.04"
    outputs:
      IMAGE: "${{ steps.output.outputs.IMAGE }}"
      VERSION: "${{ steps.output.outputs.VERSION }}"
    steps:
      - id: "image"
        run: |
          echo "IMAGE=${REGISTRY}/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
      - id: "version"
        uses: "shoce/action-version@v1"
      - id: "output"
        run: |
          echo "IMAGE=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
  
  build-push:
    
    if: true
    needs: "imageversion"
    strategy:
      matrix:
        include:
          - arch: "amd64"
            runner: "ubuntu-24.04"
          - arch: "arm64"
            runner: "ubuntu-24.04-arm"
    runs-on: "${{ matrix.runner }}"
    
    env:
      IMAGE: "${{ needs.imageversion.outputs.IMAGE }}"
      VERSION: "${{ needs.imageversion.outputs.VERSION }}"
    
    steps:

      - uses: "shoce/action-checkout@v1"

      # https://github.com/docker/setup-buildx-action/tags
      - uses: "docker/setup-buildx-action@v4"

      # https://github.com/docker/login-action/tags
      - uses: "docker/login-action@v4"
        with:
          registry: "${{ env.REGISTRY }}"
          username: "${{ github.repository_owner }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      # https://github.com/docker/metadata-action/tags
      - uses: "docker/metadata-action@v6"
        id: "meta"
        with:
          images: "${{ env.REGISTRY }}/${{ github.repository }}/${{ github.ref_name }}"

      # https://github.com/docker/build-push-action/tags
      - uses: "docker/build-push-action@v7"
        with:
          context: "."
          platforms: "linux/${{ matrix.arch }}"
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ github.ref_name }}:${{ env.VERSION }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"

      - uses: "shoce/action-git-tag@v1"

      # https://github.com/actions/delete-package-versions/tags
      - uses: actions/delete-package-versions@v5
        with:
          package-name: "${{ github.event.repository.name }}/${{ github.ref_name }}"
          package-type: "container"
          min-versions-to-keep: 16
          delete-only-untagged-versions: "false"

  manifest:
    
    needs:
      - "imageversion"
      - "build-push"
    
    runs-on: "ubuntu-24.04"
    
    env:
      IMAGE: "${{ needs.imageversion.outputs.IMAGE }}"
      VERSION: "${{ needs.imageversion.outputs.VERSION }}"
    
    steps:
      
      - uses: "docker/login-action@v4"
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: "multi-arch manifest"
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64" 



