# https://github.com/docker/build-push-action
# https://docs.github.com/en/actions/learn-github-actions/contexts

name: docker

permissions:
  contents: write
  packages: write
  id-token: write

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - 'helm/**'
      - '.github/workflows/helm.yaml'
      - '.github/workflows/dagger.yaml'

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    if: false
    runs-on: ubuntu-24.04
    steps:

      - uses: shoce/action-version@v1

      - uses: shoce/action-checkout@v1

      # https://github.com/docker/setup-buildx-action/tags
      - uses: docker/setup-buildx-action@v4

      # https://github.com/docker/login-action/tags
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://github.com/docker/metadata-action/tags
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ github.ref_name }}

      # https://github.com/docker/build-push-action/tags
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ github.ref_name }}:${{ env.VERSION }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: shoce/action-git-tag@v1

      # https://github.com/actions/delete-package-versions/tags
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/${{ github.ref_name }}
          package-type: container
          min-versions-to-keep: 12
          delete-only-untagged-versions: "false"


